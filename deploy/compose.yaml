# One Cloud Pi instance for both Feishu and WeCom. Existing Cloud Auth,
# New API and Caddy containers are not members of this Compose project.
services:
  cloud-pi:
    image: ${CLOUD_PI_IMAGE:?Set CLOUD_PI_IMAGE to an immutable release-tagged image}
    container_name: mira-cloud-pi
    # Both existing services listen on the host loopback (3000, 8788).
    # The Cloud Pi management API also binds strictly to 127.0.0.1:8787.
    network_mode: host
    restart: unless-stopped
    init: true
    stop_grace_period: 35s
    mem_limit: 640m
    cpus: 1.5
    pids_limit: 256
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
    volumes:
      - ${CLOUD_PI_DATA_DIR:?Set CLOUD_PI_DATA_DIR to a persistent writable directory}:/var/lib/cloud-pi
      - ${CLOUD_PI_SECRETS_FILE:?Set CLOUD_PI_SECRETS_FILE to a private real file}:/run/secrets/agent.env:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/v1/health',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
